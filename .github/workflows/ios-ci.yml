name: iOS CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run lint checks
        run: ./scripts/ci/lint.sh

  build-and-test:
    name: Build And Test
    runs-on: macos-latest
    needs:
      - lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve simulator destination
        id: simulator
        run: |
          destination="$(./scripts/ci/detect_simulator_destination.sh)"
          echo "destination=$destination" >> "$GITHUB_OUTPUT"
          echo "Using destination: $destination"

      - name: Build for testing
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: ./scripts/ci/build_for_testing.sh "$DESTINATION"

      - name: Run tests
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: ./scripts/ci/test_without_building.sh "$DESTINATION"
